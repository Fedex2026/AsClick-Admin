<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AS CLICK Admin | Acceso</title>

  <style>

    *{box-sizing:border-box}

    body{

      margin:0;

      min-height:100vh;

      display:grid;

      place-items:center;

      font-family:Arial,Helvetica,sans-serif;

      background:#071421;

      color:#fff;

    }

    .login-card{

      width:min(430px,calc(100% - 32px));

      background:#0d2032;

      border:1px solid #20384d;

      border-radius:18px;

      padding:32px;

      box-shadow:0 20px 60px rgba(0,0,0,.35);

    }

    .brand{

      display:flex;

      align-items:center;

      gap:14px;

      margin-bottom:28px;

    }

    .brand-icon{

      width:52px;height:52px;border-radius:50%;

      display:grid;place-items:center;

      border:3px solid #147fe8;

      color:#ff9d22;

      font-size:26px;

      font-weight:900;

    }

    .brand h1{margin:0;font-size:25px}

    .brand small{color:#ff9d22;font-weight:700;letter-spacing:1.5px}

    h2{margin:0 0 8px;font-size:27px}

    .sub{margin:0 0 24px;color:#9db0c3;line-height:1.5}

    label{

      display:block;

      margin:16px 0 7px;

      color:#c9d6e2;

      font-weight:700;

      font-size:14px;

    }

    input{

      width:100%;

      height:50px;

      border-radius:10px;

      border:1px solid #30495f;

      background:#091827;

      color:#fff;

      padding:0 14px;

      font-size:16px;

      outline:none;

    }

    input:focus{border-color:#1989f5}

    button{

      width:100%;

      height:50px;

      margin-top:22px;

      border:0;

      border-radius:10px;

      background:#176fd1;

      color:#fff;

      font-size:16px;

      font-weight:800;

      cursor:pointer;

    }

    button:disabled{opacity:.6;cursor:not-allowed}

    #message{

      min-height:22px;

      margin-top:16px;

      font-size:14px;

      line-height:1.45;

      color:#ff6674;

    }

    .help{

      margin-top:18px;

      padding-top:18px;

      border-top:1px solid #20384d;

      color:#7890a6;

      font-size:12px;

      line-height:1.5;

    }

  </style>

</head>

<body>

  <main class="login-card">

    <div class="brand">

      <div class="brand-icon">↗</div>

      <div>

        <h1>AS CLICK</h1>

        <small>PANEL ADMINISTRATIVO</small>

      </div>

    </div>

 

    <h2>Acceso administrador</h2>

    <p class="sub">Inicia sesión con la cuenta de Firebase autorizada como administrador.</p>

 

    <form id="loginForm">

      <label for="email">Correo</label>

      <input id="email" type="email" autocomplete="username" required />

 

      <label for="password">Contraseña</label>

      <input id="password" type="password" autocomplete="current-password" required />

 

      <button id="loginButton" type="submit">Entrar al panel</button>

      <div id="message" role="alert"></div>

    </form>

 

    <div class="help">

      La cuenta debe existir en Firebase Authentication y tener un documento

      <b>usuarios/{uid}</b> con <b>rol: "admin"</b> y <b>activo: true</b>.

    </div>

  </main>

 

  <script type="module" src="./login.js"></script>

</body>

</html>
